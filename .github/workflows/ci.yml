name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22.x"
          cache: true
      - name: gofmt
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "These files are not gofmt'd:"
            echo "$unformatted"
            exit 1
          fi
      - name: vet
        run: go vet ./...
      - name: test
        run: go test -race ./...

  build:
    name: build ${{ matrix.goos }}/${{ matrix.goarch }}
    runs-on: ubuntu-latest
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64
          - goos: windows
            goarch: amd64
          - goos: windows
            goarch: arm64
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22.x"
          cache: true
      - name: build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: |
          out="dist/alocal-${{ matrix.goos }}-${{ matrix.goarch }}"
          if [ "${GOOS}" = "windows" ]; then out="${out}.exe"; fi
          mkdir -p dist
          go build -trimpath -ldflags="-s -w" -o "${out}" ./cmd/alocal
      - name: smoke test (host-compatible only)
        if: matrix.goos == 'linux' && matrix.goarch == 'amd64'
        run: ./dist/alocal-linux-amd64 catalog validate
      - uses: actions/upload-artifact@v4
        with:
          name: alocal-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/
          if-no-files-found: error
